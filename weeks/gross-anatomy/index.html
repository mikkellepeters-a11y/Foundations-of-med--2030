<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gross Anatomy Hub · Musculoskeletal-Skin</title><body><script>
(async()=>{
  const r=await fetch('https://raw.githubusercontent.com/mikkellepeters-a11y/Foundations-of-med--2030/3c4ae527500e332922e3e9e0618006fa2c5a3fa8/weeks/gross-anatomy/index.html');
  if(!r.ok)throw new Error('Gross Anatomy source failed');
  let source=await r.text();
  const needle="  const style=d.createElement('style');";
  const patch=`  const upperCard=d.querySelector('[data-name="Upper Extremity Gross Anatomy"]');
  if(upperCard){
    upperCard.classList.remove('placeholder');
    upperCard.setAttribute('href','upper-extremity/index.html');
    const status=upperCard.querySelector('.status');
    if(status)status.textContent='Choose a dissection';
  }

  const style=d.createElement('style');`;
  if(!source.includes(needle))throw new Error('Gross Anatomy route patch point missing');
  source=source.replace(needle,patch);
  document.open();document.write(source);document.close();
})().catch(e=>{console.error(e);document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Gross Anatomy hub failed to load. Please refresh.</p>'});
</script></body>
