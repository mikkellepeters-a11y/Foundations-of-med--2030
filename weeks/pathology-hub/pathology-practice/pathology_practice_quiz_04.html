<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pathology Practice Quiz 03</title><div id="load" style="font-family:Inter,system-ui,sans-serif;padding:24px">Loading quiz…</div>
<script>(async()=>{try{const r=await fetch("../assets/exact-quiz-03.txt",{cache:"no-store"});if(!r.ok)throw new Error("quiz asset");const b=(await r.text()).replace(/\s+/g,"");const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(html);document.close();}catch(e){console.error(e);document.getElementById("load").innerHTML="<b>Quiz could not load.</b><br>Please refresh the page.";}})();</script>
