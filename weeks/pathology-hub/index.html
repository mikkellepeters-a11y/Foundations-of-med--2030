<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundations Pathology Hub — Ozzy</title>
<style>
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4ede5;color:#4d3529;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}
</style>
<div class="load">Loading Ozzy’s Pathology Hub…</div>
<script>
(async()=>{
  const files=[
    "assets/ozzy-01.txt","assets/ozzy-02.txt","assets/ozzy-03.txt","assets/ozzy-04.txt","assets/ozzy-05.txt",
    "assets/ozzy-06.txt","assets/ozzy-07.txt","assets/ozzy-08.txt","assets/ozzy-09.txt","assets/ozzy-10.txt"
  ];
  const parts=await Promise.all(files.map(async f=>{
    const r=await fetch(f,{cache:"no-store"});
    if(!r.ok) throw new Error(`Could not load ${f}`);
    return (await r.text()).replace(/\s+/g,"");
  }));

  // ozzy-07 was accidentally saved with an extra payload appended to it.
  // Keep only the original Pathology Hub segment we built.
  parts[6]=parts[6].slice(0,13098);

  const b64=parts.join("");
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(typeof DecompressionStream!=="function") throw new Error("This browser does not support gzip decompression");
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();
  document.write(html);
  document.close();
})().catch(e=>{
  console.error(e);
  document.body.innerHTML='<div class="load"><b>Pathology Hub could not load.</b><br><span style="font-size:13px;opacity:.75">Please hard-refresh this page once.</span></div>';
});
</script>
