<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundations Pathology Hub — Ozzy</title><style>body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4ede5;color:#4d3529;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}</style><div class="load">Loading Pathology Hub…</div><script>(async()=>{try{const r=await fetch("payload/hub.txt",{cache:"no-store"});if(!r.ok)throw new Error("hub payload");const b=(await r.text()).replace(/\s+/g,"");const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(html);document.close();}catch(e){console.error(e);document.body.innerHTML='<div class="load"><b>Pathology Hub could not load.</b><br>Please refresh the page.</div>'}})();</script>
