<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathology Practice Quiz</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4ede5;color:#4d3529;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}</style><div class="load">Loading Pathology Practice Quiz…</div><script>
(async()=>{
 const files=["assets/quiz-app-01.txt","assets/quiz-app-02.txt"];
 const b64=(await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f);return r.text()}))).join("");
 const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 document.open();document.write(html);document.close();
})().catch(e=>{console.error(e);document.body.innerHTML='<div class="load"><b>Quiz could not load.</b><br>Please refresh the page.</div>'});
</script>
