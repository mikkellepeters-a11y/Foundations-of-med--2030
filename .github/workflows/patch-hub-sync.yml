name: Patch Hub Quiz Sync
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-hub-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shared sync into Drug and Pathology quizzes
        run: |
          python - <<'PY'
          from pathlib import Path

          sets = [
              (Path('drug-practice').glob('drug_practice_quiz_*.html'), '<script src="../shared/hub-quiz-sync.js"></script>'),
              (Path('weeks/pathology-hub/pathology-practice').glob('pathology_practice_quiz_*.html'), '<script src="../../../shared/hub-quiz-sync.js"></script>'),
          ]
          changed = 0
          for paths, tag in sets:
              for path in paths:
                  text = path.read_text(encoding='utf-8')
                  if 'hub-quiz-sync.js' in text:
                      continue
                  if '</body>' not in text:
                      raise RuntimeError(f'Missing closing body tag: {path}')
                  path.write_text(text.replace('</body>', tag + '\n</body>'), encoding='utf-8')
                  changed += 1

          profile = Path('my-profile.html')
          text = profile.read_text(encoding='utf-8')
          helper_anchor = "const isVignette=x=>{const n=vignetteSet(x);return Number.isFinite(n)&&n>=1&&n<=50};"
          helper = helper_anchor + "\nconst isAuxiliaryHub=x=>/^(?:drug|pathology)-practice-\\d+$/i.test(String(x?.quiz_id||''));\nconst isFoundationsTracked=x=>String(x?.metadata?.module||'').toLowerCase()==='foundations of medicine'||(!x?.metadata?.module&&!isAuxiliaryHub(x));"
          if 'const isFoundationsTracked=' not in text:
              if helper_anchor not in text:
                  raise RuntimeError('My Profile helper anchor changed')
              text = text.replace(helper_anchor, helper)
          old_topics = "function renderTopics(){const grouped={};questionAttempts.forEach(q=>"
          new_topics = "function renderTopics(){const grouped={};questionAttempts.filter(isFoundationsTracked).forEach(q=>"
          if old_topics in text:
              text = text.replace(old_topics, new_topics)
          old_badge = "document.getElementById('foundationsAttemptBadge').textContent=`${quizAttempts.length} synced attempt${quizAttempts.length===1?'':'s'}`"
          new_badge = "const foundationsAttempts=quizAttempts.filter(isFoundationsTracked);document.getElementById('foundationsAttemptBadge').textContent=`${foundationsAttempts.length} synced attempt${foundationsAttempts.length===1?'':'s'}`"
          if old_badge in text:
              text = text.replace(old_badge, new_badge)
          profile.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/patch-hub-sync.yml')
          if workflow.exists():
              workflow.unlink()
          print(f'Injected sync into {changed} quiz files.')
          PY
      - name: Commit generated quiz hooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Drug and Pathology quizzes to Supabase" || exit 0
          git push
