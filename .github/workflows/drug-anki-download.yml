name: Add Drug Hub Anki download

on:
  push:
    branches:
      - drug-anki-download

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: drug-anki-download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch Drug Hub
        run: python tmp/drug-anki/apply_patch.py

      - name: Commit patched hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks/drug-hub/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Drug Hub Anki download button"
          git push origin HEAD:drug-anki-download
