name: Publish Week 13 Anki Decks 1-3
on:
  push:
    paths:
      - 'weeks/week13/build_missing_anki.py'
      - '.github/workflows/publish-week13-anki.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install genanki==0.13.1
      - run: python weeks/week13/build_missing_anki.py
      - name: Commit and push APKG packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks/week13/MSK_Week13_Lecture1_Combined.apkg weeks/week13/MSK_Week13_Lecture2_Combined.apkg weeks/week13/MSK_Week13_Lecture3_Combined.apkg
          git diff --cached --quiet || (git commit -m "Publish working Lecture 1 2 3 Anki packages" && git push)
