name: Diagnose CBL render
on:
  push:
    branches: [cbl-render-diagnosis]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install jsdom@24
      - name: Test affected CBL pages
        run: |
          cat > /tmp/test-cbl.js <<'NODE'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const files=[
            'weeks/cbl/week3_case_quiz_30.html',
            'weeks/cbl/week6_case_quiz_33.html',
            'weeks/cbl/week8_case_quiz_27.html',
            'weeks/cbl/week9_case_quiz_28.html'
          ];
          (async()=>{
            let failed=false;
            for(const file of files){
              let html=fs.readFileSync(file,'utf8');
              html=html.replace(/<script\s+src=[\s\S]*?<\/script>/gi,'');
              const errors=[];
              const vc=new VirtualConsole();
              vc.on('jsdomError',e=>errors.push('JSDOM: '+e.message));
              vc.on('error',(...a)=>errors.push('console.error: '+a.join(' ')));
              try{
                const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://example.test/'+file,virtualConsole:vc,beforeParse(w){w.confirm=()=>true;w.scrollTo=()=>{};}});
                await new Promise(r=>setTimeout(r,100));
                const count=dom.window.document.querySelectorAll('#quiz .question').length;
                console.log('\n'+file+' -> rendered questions:',count);
                if(errors.length) console.log(errors.join('\n'));
                if(!count) failed=true;
                dom.window.close();
              }catch(e){console.log('\n'+file+' -> THROW:',e.stack||e);failed=true;}
            }
            if(failed) process.exit(1);
          })();
          NODE
          node /tmp/test-cbl.js
