name: Rebuild Drug Anki binary

on:
  push:
    branches:
      - drug-anki-download

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: drug-anki-download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild and validate deck
        run: python tmp/drug-anki-bin/rebuild.py

      - name: Commit corrected deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks/drug-hub/downloads/Foundations_Pharmacology_Use_First_95.apkg
          git diff --cached --quiet && exit 0
          git commit -m "Validate Drug Hub Anki deck binary"
          git push origin HEAD:drug-anki-download
