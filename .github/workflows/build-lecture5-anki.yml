name: Build Lecture 5 Anki Deck
on:
  push:
    paths:
      - 'weeks/week13/build_lecture5_anki.py'
      - '.github/workflows/build-lecture5-anki.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install genanki==0.13.1
      - name: Build package
        run: python weeks/week13/build_lecture5_anki.py
      - name: Validate archive and Anki package
        run: |
          python - <<'PY'
          import zipfile,sqlite3,tempfile,pathlib
          p=pathlib.Path('weeks/week13/MSK_Week13_Lecture5_Text_Only_FIXED.apkg')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'collection.anki2' in z.namelist()
              with tempfile.TemporaryDirectory() as d:
                  db=pathlib.Path(d)/'collection.anki2'
                  db.write_bytes(z.read('collection.anki2'))
                  cx=sqlite3.connect(db)
                  assert cx.execute('pragma integrity_check').fetchone()[0]=='ok'
                  print('notes',cx.execute('select count(*) from notes').fetchone()[0])
                  assert cx.execute('select count(*) from notes').fetchone()[0]==76
                  assert cx.execute('select count(*) from cards').fetchone()[0]==76
          PY
      - name: Commit repaired deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks/week13/MSK_Week13_Lecture5_Text_Only_FIXED.apkg
          git diff --cached --quiet || (git commit -m "Publish valid Lecture 5 text-only Anki deck" && git push)
