name: Apply CBL Supabase integration
on:
  push:
    branches: [cbl-weeks3-9-supabase]
    paths:
      - 'scripts/integrate_cbl_supabase.py'
      - 'weeks/cbl/cbl-supabase.js'
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbl-weeks3-9-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/integrate_cbl_supabase.py
      - name: Commit generated HTML changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weeks/cbl/week*_case_quiz_*.html
          git commit -m 'Wire CBL Weeks 3-9 to shared Supabase integration'
          git push origin HEAD:cbl-weeks3-9-supabase
