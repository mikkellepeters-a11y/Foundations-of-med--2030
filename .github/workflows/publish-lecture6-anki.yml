name: Publish Lecture 6 Anki
on:
  push:
    paths:
      - 'weeks/week13/build_lecture6_anki.py'
      - '.github/workflows/publish-lecture6-anki.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Anki package builder
        run: python -m pip install genanki==0.13.1
      - name: Build and validate all 70 cards
        run: python weeks/week13/build_lecture6_anki.py
      - name: Publish package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks/week13/MSK_Week13_Lecture6_Text_Only.apkg
          git diff --cached --quiet || (git commit -m "Publish approved Lecture 6 Anki package" && git push)
