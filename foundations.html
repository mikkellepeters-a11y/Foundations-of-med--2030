<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundations of Medicine</title>
<style>
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3ece3;color:#3e3028;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}
</style>
<div class="load">Loading Foundations of Medicine…</div>
<script>
(async()=>{
  let html=await fetch("foundations-base.html").then(r=>{
    if(!r.ok) throw new Error("foundations-base.html");
    return r.text();
  });
  html=html.replace(
    ".header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}",
    ".header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.hub-button-stack{display:flex;flex-direction:column;gap:8px;align-items:stretch}.module-hub-back{display:inline-flex;align-items:center;flex:0 0 auto;width:max-content;padding:5px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;font-size:9px;line-height:1.1;font-weight:800;transition:.15s ease}.module-hub-back:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}"
  );
  html=html.replace('<div class="brand-row"><div class="brand">','<div class="brand-row"><a class="module-hub-back" href="index.html" aria-label="Back to Module Hub">← Module Hub</a><div class="brand">');
  const old='<div class="header-actions"><div class="header-badge">Notes · Quizzes · Review</div><a class="header-link drug-hub-button" href="weeks/drug-hub/index.html" aria-label="Open Drug Hub"><span>Drug Hub</span></a></div></div>';
  const next='<div class="header-actions"><div class="header-badge">Notes · Quizzes · Review</div><div class="hub-button-stack"><a class="header-link drug-hub-button" href="foundations-leaderboard.html" aria-label="Open Foundations Leaderboard"><span>Leaderboard</span></a><a class="header-link drug-hub-button" href="weeks/drug-hub/index.html" aria-label="Open Drug Hub"><span>Drug Hub</span></a><a class="header-link drug-hub-button" href="weeks/pathology-hub/index.html" aria-label="Open Path Hub"><span>Path Hub</span></a></div></div></div>';
  if(!html.includes(old)) throw new Error("Header markup changed");
  html=html.replace(old,next);

  html=html.replace('Feedback + future features','Feedback + live leaderboard');
  const oldLeaderboard='<article class="feedback-card">\n<span class="feedback-badge">Future Feature</span>\n<h3>Quiz Leaderboard</h3>\n<p>A shared leaderboard for quizzes completed, total questions answered, or completion streaks would need a small shared database or service behind the site. The current GitHub Pages setup only stores quiz progress in each person\'s own browser, so it cannot compare users globally yet.</p>\n</article>';
  const liveLeaderboard='<article class="feedback-card">\n<span class="feedback-badge">Live Now</span>\n<h3>Foundations Leaderboard</h3>\n<p>See the live individual and CBL team standings based on participation across Foundations of Medicine. Questions earn points by difficulty: In-House +1, Intermediate +2, and Step 1 +3. Correctness does not affect leaderboard points.</p>\n<a class="feedback-action" href="foundations-leaderboard.html">Open Leaderboard →</a>\n</article>';
  if(!html.includes(oldLeaderboard)) throw new Error("Leaderboard card markup changed");
  html=html.replace(oldLeaderboard,liveLeaderboard);

  document.open();document.write(html);document.close();
})().catch(e=>{
  console.error(e);
  document.body.innerHTML='<div class="load"><b>Foundations Hub could not load.</b><br>Please refresh the page.</div>';
});
</script>
