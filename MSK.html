<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musculoskeletal-Skin</title>
<body>
<script>
(async()=>{
  const nativeFetch=window.fetch.bind(window);
  const fixTag='<script src="shared/msk-review-route-fix.js"><\\/script>';

  window.fetch=async(...args)=>{
    const res=await nativeFetch(...args);
    const input=args[0];
    const url=typeof input==='string'?input:(input&&input.url)||'';
    if(url.includes('raw.githubusercontent.com/mikkellepeters-a11y/Foundations-of-med--2030/')&&/\/MSK\.html(?:\?|$)/.test(url)){
      let txt=await res.text();
      if(!txt.includes('shared/msk-review-route-fix.js')&&txt.includes('</body>')){
        txt=txt.replace('</body>',fixTag+'</body>');
      }
      return new Response(txt,{status:res.status,statusText:res.statusText,headers:res.headers});
    }
    return res;
  };

  const r=await nativeFetch('https://raw.githubusercontent.com/mikkellepeters-a11y/Foundations-of-med--2030/eadab87287e1b5a344263704ac98b2f2814d8eb4/MSK.html');
  if(!r.ok)throw new Error('MSK base failed');
  document.open();document.write(await r.text());document.close();
})().catch(e=>{
  console.error(e);
  document.body.innerHTML='<p style="font-family:system-ui;padding:24px">MSK hub failed to load. Please refresh.</p>';
});
</script>
</body>
