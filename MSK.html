ds=()=>{const week13=document.querySelector('[data-name="MSK-Skin Week 13"]');if(week13){const clean=week13.cloneNode(true);clean.classList.remove('placeholder','locked-card');clean.classList.add('active-card');clean.setAttribute('href','weeks/week13/index.html');clean.removeAttribute('onclick');clean.onclick=null;const badge=clean.querySelector('.locked-badge');if(badge)badge.remove();week13.replaceWith(clean);}const gross=document.querySelector('[data-name="Gross Anatomy Lab"]');if(gross){const g=gross.cloneNode(true);g.classList.remove('placeholder','locked-card');g.classList.add('active-card');g.setAttribute('href','weeks/gross-anatomy/index.html');g.removeAttribute('onclick');g.onclick=null;const gb=g.querySelector('.locked-badge');if(gb)gb.remove();gross.replaceWith(g);}const drug=document.querySelector('[data-name="MSK-Skin Drug Hub"]');if(drug){drug.classList.remove('placeholder','locked-card');drug.classList.add('active-card');drug.setAttribute('href','weeks/msk-drug-hub/index.html');drug.removeAttribute('onclick');drug.onclick=null;const db=drug.querySelector('.locked-badge');if(db)db.remove();}const candidates=[...document.querySelectorAll('[data-name],a,.week-card,.card,.feature-card')];const path=candidates.find(isPathHub);if(path){const p=path.cloneNode(true);p.classList.remove('placeholder','locked-card');p.classList.add('active-card');p.setAttribute('href','weeks/msk-pathology-hub/index.html');p.removeAttribute('onclick');p.onclick=null;const pb=p.querySelector('.locked-badge');if(pb)pb.remove();path.replaceWith(p);}};document.addEventListener('DOMContentLoaded',activateCards);setTimeout(activateCards,250);setTimeout(activateCards,900);document.addEventListener('click',e=>{const gross=e.target.closest&&e.target.closest('[data-name="Gross Anatomy Lab"]');if(gross){e.preventDefault();e.stopImmediatePropagation();window.location.href='weeks/gross-anatomy/index.html';return;}const drug=e.target.closest&&e.target.closest('[data-name="MSK-Skin Drug Hub"]');if(drug){e.preventDefault();e.stopImmediatePropagation();window.location.href='weeks/msk-drug-hub/index.html';}},true);})();<\/script>`;txt=txt.includes('</body>')?txt.replace('</body>',activate+'</body>'):txt+activate;}return new Response(txt,{status:res.status,statusText:res.statusText,headers:res.headers});}return res;};const r=await nativeFetch('https://raw.githubusercontent.com/mikkellepeters-a11y/Foundations-of-med--2030/ebaeccdc3bacb39167a599d2c6edcd956acf4113/MSK.html');if(!r.ok)throw new Error('MSK base failed');const t=await r.text();document.open();document.write(t);document.close()})().catch(e=>{console.error(e);document.body.innerHTML='<p style="font-family:system-ui;padding:24px">MSK hub failed to load. Please refresh.</p>'})</script></body>
